services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: collection
      POSTGRES_USER: collection
      POSTGRES_PASSWORD: collection
    ports:
      - "5432:5432"
    volumes:
      - collection-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collection -d collection"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  collection-postgres:
